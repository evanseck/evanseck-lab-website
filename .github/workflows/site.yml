name: Build and publish site

on:
  push:
    branches: [main]        # rebuild whenever anyone changes a file
  schedule:
    - cron: "0 10 * * *"    # every day: fetch new publications, news and Instagram posts, then rebuild
  workflow_dispatch:         # "Run workflow" button on the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install markdown pyyaml pillow pillow-heif pypdf

      - name: Fetch publications, dissertations, covers, Duquesne news, GRS and Instagram (daily and manual runs)
        if: github.event_name != 'push'
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: |
          python scripts/update_publications.py || echo "::warning::Publication update skipped; the site uses the existing list."
          python scripts/update_dissertations.py
          python scripts/update_covers.py
          python scripts/update_news.py
          python scripts/update_grs.py
          python scripts/update_instagram.py
          mkdir -p images/covers/auto images/instagram
          git add -N data images/covers/auto images/instagram 2>/dev/null || true
          if ! git diff --quiet -- data images/covers/auto images/instagram; then
            git config user.name "github-actions[bot]"
            git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
            git add -A data images/covers/auto images/instagram
            git commit -m "Automatic update: publications, news, GRS and Instagram"
            git push
          fi

      - name: Build site from content files
        run: python scripts/build.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
