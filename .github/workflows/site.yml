name: Build and publish site

on:
  push:
    branches: [main]        # rebuild whenever anyone changes a file
  schedule:
    - cron: "0 10 * * 1"    # every Monday: fetch new publications, then rebuild
  workflow_dispatch:         # "Run workflow" button on the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install markdown pyyaml pillow

      - name: Fetch publications, dissertations, covers and Duquesne news (weekly and manual runs)
        if: github.event_name != 'push'
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          python scripts/update_publications.py || echo "::warning::Publication update skipped; the site uses the existing list."
          python scripts/update_dissertations.py
          python scripts/update_covers.py
          python scripts/update_news.py
          git add -N data images/covers/auto 2>/dev/null || true
          if ! git diff --quiet -- data images/covers/auto; then
            git config user.name "github-actions[bot]"
            git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
            git add data images/covers/auto
            git commit -m "Weekly update: publications, dissertations, covers and Duquesne news"
            git push
          fi

      - name: Build site from content files
        run: python scripts/build.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
